version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for the dev toolchain; runtime deps (react, d3) stay one per PR.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Majors with their own ticket (#61): React 19 and TypeScript 7.
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react-dom'
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # ESLint 10 (#81): eslint-plugin-jsx-a11y's peer range stops at ^9. Lift when it widens.
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: '@eslint/js'
        update-types: [version-update:semver-major]
      # @types/node tracks the CI matrix floor (Node 22), not the newest Node (#81).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
