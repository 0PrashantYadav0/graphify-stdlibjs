name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: test / typecheck / build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the oldest maintained LTS matching the @types/node major this
        # repo pins against; 24 is the current active LTS. Both are within
        # Node's support window, so this catches regressions on the floor and
        # the ceiling of what the project actually targets.
        node-version: [22.x, 24.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check graph.json
        run: npm run check:data

      # npm run build runs tsc --noEmit first, so it is the typecheck too.
      - name: Typecheck and build
        run: npm run build

      - name: Check size budgets
        run: npm run check:size
